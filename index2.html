<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desarrollo de colaboradores y parrilla de reemplazo 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#f5eefb; --plum:#3a1560; --violet:#7a3fb8; --red:#c8102e; --paper:#ffffff; --ink:#25103a; --mute:#6d5890;
  --display:'Unbounded','Arial Black',sans-serif; --body:'Figtree','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--night);color:var(--ink);overflow-x:hidden;
  background-image:radial-gradient(rgba(122,63,184,.14) 1px,transparent 1.6px),radial-gradient(900px 520px at 85% -10%,rgba(122,63,184,.28),transparent 70%),radial-gradient(700px 520px at -10% 105%,rgba(200,16,46,.15),transparent 70%),radial-gradient(600px 400px at 55% 60%,rgba(190,160,235,.3),transparent 75%);background-size:28px 28px,auto,auto,auto;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}

/* barra superior y ruta de navegación */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,4vw,48px);background:rgba(255,255,255,.8);backdrop-filter:blur(8px);box-shadow:0 2px 18px rgba(58,21,96,.1)}
.brand{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.02em}
.brand b{color:var(--red)}
nav{display:flex;align-items:center;gap:0;overflow-x:auto}
nav button{position:relative;padding:8px 12px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;border-radius:99px;transition:color .2s}
nav button::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--mute);margin-right:8px;vertical-align:-1px;transition:.2s}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"]::before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,.25)}

main{min-height:calc(100% - 60px)}
.view{padding:clamp(20px,5vw,56px);max-width:1280px;margin:0 auto;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* portada */
.cover{min-height:calc(100vh - 60px);max-width:none;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.cover h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,4.6vw,64px);line-height:1.04;max-width:13ch;position:relative;z-index:1}
.cover h1 span{display:block;color:var(--red)}
.cover p{margin:22px 0 34px;max-width:46ch;font-size:clamp(16px,2vw,20px);color:var(--mute);position:relative;z-index:1}
.go{align-self:flex-start;display:inline-flex;align-items:center;gap:14px;background:var(--red);padding:16px 26px;border-radius:99px;font-weight:700;font-size:17px;position:relative;z-index:1;transition:transform .2s,box-shadow .2s}
.go:hover{transform:translateX(6px);box-shadow:0 10px 30px rgba(200,16,46,.45)}
.road{position:absolute;left:0;right:0;bottom:12%;height:70px;background:#5a3f7d;border-block:3px solid rgba(255,255,255,.4)}
.road::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;
  background:repeating-linear-gradient(90deg,#fff 0 46px,transparent 46px 92px);opacity:.75;animation:drive 2.2s linear infinite}
@keyframes drive{to{background-position:-92px 0}}

/* tarjetas de personas */
.card{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--paper);color:var(--ink);border-radius:20px;padding:0 18px 20px;width:100%;max-width:230px;position:relative;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.pic{width:92px;height:92px;border-radius:50%;margin-top:-26px;background:linear-gradient(135deg,var(--violet),var(--red));display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px;color:#fff;border:4px solid var(--paper);overflow:hidden;position:relative;flex:none}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card h3{font-family:var(--display);font-weight:700;font-size:13px;line-height:1.35;margin:14px 0 6px}
.card p{font-size:14px;color:#5b4573;line-height:1.35}
.card.boss{max-width:280px;border-bottom:6px solid var(--red)}
.card.boss .pic{width:112px;height:112px}
.card.big{max-width:290px;padding-bottom:28px}
.card.big .pic{width:128px;height:128px;margin-top:-40px}
.card.big h3{font-size:15px}.card.big p{font-size:15px}

/* organigrama: ruta con paradas */
.top{display:flex;flex-direction:column;align-items:center;padding-top:30px}
.stem{width:4px;height:36px;background:repeating-linear-gradient(var(--red) 0 6px,transparent 6px 12px)}
.route{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;position:relative;margin-top:0;padding-top:24px}
.route::before{content:"";position:absolute;top:24px;left:16.6%;right:16.6%;height:4px;background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 16px)}
.stop{display:flex;flex-direction:column;align-items:center;gap:34px;padding-top:0}
.pin{position:relative;z-index:1;margin-top:-24px;display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);padding:10px 20px 10px 14px;border-radius:99px;font-family:var(--display);font-weight:700;font-size:14px;transition:.2s}
.pin::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,.25)}
.pin:hover{background:var(--red);color:#fff;transform:scale(1.06)}
.pin:hover::before{background:#fff}
.people{display:flex;flex-wrap:wrap;gap:34px 16px;justify-content:center;margin-top:-6px}
.hint{text-align:center;color:var(--mute);margin-top:36px;font-size:14px}

/* detalle de plaza */
.back{color:var(--mute);font-weight:600;padding:8px 0;margin-bottom:8px}
.back:hover{color:var(--ink)}
.plaza h2{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,72px);line-height:1}
.plaza h2 em{font-style:normal;color:var(--red)}
.plaza .sub{color:var(--mute);margin:12px 0 48px;font-size:18px}
.lead{display:flex;align-items:center;gap:20px;margin-bottom:56px;flex-wrap:wrap}
.lead .line{flex:1;min-width:40px;height:4px;background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 16px)}
.lead small{font-size:14px;color:var(--mute);max-width:16ch}
.team{display:flex;flex-wrap:wrap;gap:56px 28px;padding-top:28px}


/* gerencia, parrilla, proyectos */
.bosslink{display:flex;justify-content:center;width:100%;max-width:280px;transition:transform .2s}
.bosslink:hover{transform:scale(1.04)}
.hub{display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap;padding-top:34px}
.tiles{flex:1;min-width:280px;display:grid;gap:16px}
.tile{border-radius:18px;padding:30px 32px;text-align:left;font-family:var(--display);font-weight:700;font-size:clamp(18px,2.6vw,28px);transition:transform .2s}
.tile small{display:block;margin-top:8px;font-family:var(--body);font-weight:600;font-size:14px;opacity:.8}
.tile:hover{transform:translateX(10px)}
.t1{background:#ecb731;color:#1b0a2b}.t2{background:var(--red)}.t3{background:#e3e8fb;color:var(--ink)}
.succ{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding-top:40px;margin:8px 0 36px}
.succ .arrow{flex:1;min-width:60px;height:4px;background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 16px)}
.tag{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:46px;text-align:center}
.facts{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:32px}
.facts div{background:#fff;box-shadow:0 6px 18px rgba(58,21,96,.12);padding:14px 22px;border-radius:14px;font-weight:700}
.facts b{display:block;font-size:13px;color:var(--mute);font-weight:600}
.empty{margin-top:40px;padding:48px 32px;border:3px dashed rgba(122,63,184,.35);border-radius:20px;color:var(--mute);font-size:18px;max-width:640px}
.proj{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px;align-items:start}
.col h3{padding:16px 22px;border-radius:14px 14px 0 0;color:#1b0a2b;font-family:var(--display);font-size:18px}
.item{background:var(--paper);color:var(--ink);padding:16px 22px;border-top:1px solid #ddd}
.item:last-child{border-radius:0 0 14px 14px}
.item b{display:block;font-size:15px;line-height:1.3}
.item small{color:#6a5580;font-size:13px}

/* mapa estratégico */
.ladder{margin-top:34px}
.tier{display:flex;align-items:center;gap:20px;background:#fff;color:var(--ink);border-radius:999px;padding:16px 24px 16px 36px;flex-wrap:wrap}
.tier .name{font-family:var(--display);font-weight:700;font-size:clamp(15px,2vw,22px);flex:0 0 190px;text-align:left;line-height:1.2;transition:transform .2s}
.tier .name:hover{transform:translateX(6px)}
.tier .name small{display:block;margin-top:6px;font-family:var(--body);font-size:13px;font-weight:700;color:var(--red)}
.chips{flex:1;display:flex;gap:12px;flex-wrap:wrap}
.chip{flex:1;min-width:150px;border:3px solid;border-radius:999px;padding:10px 18px;text-align:center;font-weight:700;font-size:14px;line-height:1.3;display:grid;place-items:center}
.tier.a .name{color:#c2500c}.tier.a .chip{border-color:#4b2a9a}
.tier.b .chip{border-color:var(--red)}
.tier.c .name{color:#2a1bb3}.tier.c .chip{border-color:#1b0a2b}
.rise{height:44px;padding-left:56px;display:flex;align-items:center}
.rise::before{content:"";border:15px solid transparent;border-top:0;border-bottom:26px solid var(--red)}
.shot{aspect-ratio:4/3;border-radius:14px;background:linear-gradient(135deg,var(--plum),var(--violet));position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:700;text-align:center;padding:12px}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.caps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:32px}
.cap{background:var(--paper);color:var(--ink);border-radius:20px;padding:14px 14px 24px}
.cap h3{font-family:var(--display);font-size:16px;margin:18px 6px 6px}
.cap p{margin:0 6px;color:#5b4573;font-size:15px}
.split{display:flex;gap:36px;flex-wrap:wrap;align-items:center;background:var(--paper);color:var(--ink);border-radius:24px;padding:28px;margin-top:32px}
.split .shot{flex:1 1 300px;min-height:260px;aspect-ratio:auto}
.split .txt{flex:1 1 320px;font-size:clamp(18px,2.2vw,24px);line-height:1.45;color:#4b1d7a}
.doc{margin-top:32px;display:grid;gap:22px;justify-items:start}
.doc .shot{width:100%;max-width:720px;aspect-ratio:16/10}

.item{display:block;width:100%;text-align:left;transition:background .2s,padding-left .2s}
.item:hover{background:#fff;padding-left:30px}
.item small{display:block;margin-top:4px;color:var(--red);font-weight:700}
.modal{position:fixed;inset:0;z-index:20;background:rgba(40,20,70,.74);display:grid;place-items:center;padding:20px;animation:in .25s ease both}
.modal[hidden]{display:none}
.modal .sheet{max-width:min(1000px,94vw);max-height:88vh;display:grid;place-items:center}
.modal img{max-width:100%;max-height:88vh;border-radius:14px;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal .miss{background:var(--paper);color:var(--ink);padding:36px 32px;border-radius:18px;font-weight:700;font-size:18px;max-width:520px;text-align:center}
.modal .x{position:absolute;top:18px;right:18px;width:48px;height:48px;border-radius:50%;background:var(--red);font-size:20px;font-weight:700}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg svg{width:100%;height:100%}
main{position:relative;z-index:1}
.view{position:relative;isolation:isolate}
.view[data-mark]::before{content:attr(data-mark);position:absolute;right:0;bottom:-10px;z-index:-1;font-family:var(--display);font-weight:900;font-size:clamp(44px,9vw,130px);line-height:1;white-space:nowrap;color:transparent;-webkit-text-stroke:2px rgba(122,63,184,.17);pointer-events:none}
.route{background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.4));border:1px solid rgba(122,63,184,.2);border-radius:28px;padding:24px 20px 40px;backdrop-filter:blur(4px)}
.sun{position:absolute;right:7%;top:12%;width:clamp(180px,26vw,380px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffb454,#c8102e 58%,transparent 72%);opacity:.8}
.bus{position:absolute;right:5%;bottom:calc(12% + 12px);width:clamp(260px,40vw,560px);z-index:1;margin:0;animation:bob 3s ease-in-out infinite}
.bus svg{filter:drop-shadow(0 14px 14px rgba(58,21,96,.3))}
@keyframes bob{50%{transform:translateY(-4px)}}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:12%;background:linear-gradient(transparent,rgba(58,21,96,.12))}

.go,.t2,.modal .x{color:#fff}
.card,.cap,.split,.tier,.pin,.col{box-shadow:0 8px 24px rgba(58,21,96,.15)}
.col{border-radius:14px}
.tile{box-shadow:0 8px 22px rgba(58,21,96,.18)}
.bus svg,.bus img{display:block;width:100%;height:auto}

.bosslink.team{flex-direction:column;align-items:center;gap:12px;max-width:none;width:auto}
.badge{background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:8px 16px;border-radius:99px;transition:transform .2s}
.bosslink.team:hover .badge{transform:translateX(4px)}
.branch{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding-top:34px}
.wire{width:70px;height:4px;background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 16px);flex:none}
.members{flex:1;min-width:300px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px;border-left:4px dotted var(--red);padding:6px 0 6px 28px}
.mem{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px 20px 20px 999px;padding:10px 22px 10px 10px;box-shadow:0 8px 22px rgba(58,21,96,.15);transition:transform .2s}
.mem:hover{transform:translateY(-4px)}
.mem .pic{width:76px;height:76px;margin-top:0;font-size:20px;border-width:3px}
.mem h3{font-family:var(--display);font-size:12.5px;line-height:1.35;margin:2px 0 4px}
.mem p{font-size:14px;color:#5b4573;font-weight:600}
.mem small{color:var(--red);font-weight:700;font-size:13px}

.t4{background:#5b3fa8;color:#fff}
.tier.d .name{color:#4b1d7a}.tier.d .chip{border-color:var(--red)}
.perfil{display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap;padding-top:34px}
.pbody{flex:1;min-width:300px}
.pbody h3{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,44px);margin-bottom:14px}
.psico{background:#fff;border-radius:18px;padding:20px 24px;line-height:1.6;color:#4b3b60;font-weight:600;box-shadow:0 8px 24px rgba(58,21,96,.12)}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0 26px}
.ptiles .tile{font-size:clamp(17px,2.2vw,26px)}
.foda{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px;align-items:start}
.fq{border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(58,21,96,.18)}
.fq summary{list-style:none;display:flex;align-items:center;gap:18px;padding:36px 30px;font-family:var(--display);font-weight:700;font-size:clamp(20px,3vw,32px);cursor:pointer}
.fq summary::-webkit-details-marker{display:none}
.fq .ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none}
.fqb{background:#fff;color:var(--ink);padding:20px 30px 26px}
.fq ul{padding-left:20px;font-size:16px;line-height:1.55}
.fq li{margin-bottom:8px}
.fq[open]{grid-column:1/-1}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:22px;align-items:start}
.vs h4{font-family:var(--display);font-size:16px;margin-bottom:10px}
.vs>div:first-child h4{color:var(--red)}.vs>div:last-child h4{color:#4b1d7a}
.vsb{width:48px;height:48px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;align-self:center;box-shadow:0 6px 16px rgba(200,16,46,.4)}
.fq .none{list-style:none;margin-left:-20px;color:var(--mute)}
.q1{background:var(--red);color:#fff}.q1 .ico{background:#fff;color:var(--red)}
.q2{background:#fff;color:var(--ink)}.q2 .ico{background:#1b0a2b;color:#fff}
.q3{background:#ecb731;color:#1b0a2b}.q3 .ico{background:#1b0a2b;color:#fff}
.q4{background:#451d98;color:#fff}.q4 .ico{background:#fff;color:#451d98}
.obs{margin-top:30px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(58,21,96,.15);max-width:900px}
.obs h3{background:#3a1560;color:#fff;text-align:center;padding:14px;font-size:17px}
.obs p{padding:18px 24px;font-size:17px;line-height:1.55}
.obs p:nth-of-type(even){background:#f0e9fb}
.rp{display:grid;grid-template-columns:1fr 70px 1fr;gap:18px 0;align-items:center;margin:34px 0 28px}
.rh{font-size:13px;font-weight:700;color:var(--mute)}
.arrow2{height:4px;background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 16px)}
.proj.two{grid-template-columns:repeat(2,1fr)}

.memlink{display:block;width:100%;text-align:left}
.mem small.more{display:block;margin-top:4px;color:#4b1d7a}
.steps{display:flex;flex-direction:column;align-items:flex-start;gap:22px;margin-top:34px}
.step{margin-left:calc(var(--i)*70px);display:flex;align-items:center;gap:16px;padding:12px 38px 12px 12px;border-radius:999px;color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(16px,2.2vw,24px);text-align:left;box-shadow:0 8px 22px rgba(58,21,96,.22);transition:transform .2s}
.step:hover{transform:translateX(8px)}
.step .num{width:54px;height:54px;border-radius:50%;background:#fff;color:#1b0a2b;display:grid;place-items:center;font-size:26px;flex:none}
.step.s1{background:#e63030}.step.s2{background:#451d98}.step.s3{background:#ecb731;color:#1b0a2b}
.nextlvl{margin:14px 0 0 140px;border:4px solid var(--ink);border-radius:999px;padding:12px 26px;font-weight:700;display:flex;align-items:center;gap:12px}
.nextlvl span{font-size:28px}
.tblwrap{overflow-x:auto;margin-top:30px}
.tbl{border-collapse:collapse;background:#fff;box-shadow:0 8px 24px rgba(58,21,96,.15);border-radius:14px;overflow:hidden;min-width:420px}
.tbl th{background:#d9660f;color:#fff;padding:12px 16px;font-size:14px;text-align:center}
.tbl td{padding:12px 16px;border-top:1px solid #e6dcf0;font-size:15px;text-align:center}
.tbl td:nth-child(2){text-align:left}
.tbl .up{background:#bfe3a0;font-weight:700}
.tbl .down{background:#f6d0d4;font-weight:700}
.tbl tfoot td{background:#f0e9fb;font-weight:700;border-top:2px solid var(--ink)}
.tbl.est th{background:#3a1560}.tbl.est th[scope=row]{background:#4b1d7a;font-size:15px}
.tbl.est td{text-align:left;vertical-align:top;min-width:150px}
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.chart{margin-top:30px;background:#fff;border-radius:14px;padding:20px 16px 14px;box-shadow:0 8px 24px rgba(58,21,96,.15)}
.plot{display:flex;gap:6px;align-items:flex-start}
.grp{flex:1;display:flex;flex-direction:column;min-width:0}
.pair{display:flex;gap:4px;align-items:flex-end;height:240px;justify-content:center;background:repeating-linear-gradient(transparent 0 59px,#eee 59px 60px);border-bottom:2px solid #cfc3de}
.bar{width:36%;max-width:26px;border-radius:3px 3px 0 0}
.bar.d,.legend i.d{background:#9b1fd0}.bar.r,.legend i.r{background:#e8132b}
.grp label{font-size:11px;text-align:center;margin-top:6px;color:#5b4573;line-height:1.25;font-weight:600}
.legend{display:flex;gap:10px;align-items:center;justify-content:center;font-size:13px;margin-top:10px;font-weight:600}
.legend i{width:14px;height:14px;display:inline-block;border-radius:3px}
.legend i.r{margin-left:14px}
.tri{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;margin-top:30px}
.trib{text-align:center;font-weight:700}
.trib .shot{aspect-ratio:3/4;max-height:520px;margin-bottom:10px}
.trib .shot img{object-fit:contain;background:#fff}
.clist{margin:12px 6px 0 22px;font-size:14px;line-height:1.5;max-height:380px;overflow:auto}

.tr{position:fixed;inset:0;z-index:50;overflow:hidden}
.tr[hidden]{display:none}
.tr>*{display:none}
.tr[data-m=bus]{background:linear-gradient(135deg,#3a1560,#7a3fb8)}
.tr[data-m=ruta]{background:#f5eefb radial-gradient(rgba(122,63,184,.18) 1px,transparent 1.6px) 0 0/28px 28px}
.tr[data-m=circulo]{background:linear-gradient(135deg,#c8102e,#7a3fb8)}
.tr[data-m=bus].in,.tr[data-m=ruta].in{animation:trf var(--a) ease forwards}
.tr[data-m=bus].out,.tr[data-m=ruta].out{animation:trg var(--c) ease forwards}
@keyframes trf{from{opacity:0}to{opacity:1}}
@keyframes trg{from{opacity:1}to{opacity:0}}
.tr[data-m=circulo].in{animation:ci var(--a) cubic-bezier(.6,0,.3,1) forwards}
.tr[data-m=circulo].out{animation:co var(--c) cubic-bezier(.6,0,.3,1) forwards}
@keyframes ci{from{clip-path:circle(0 at var(--x) var(--y))}to{clip-path:circle(150vmax at var(--x) var(--y))}}
@keyframes co{from{clip-path:circle(150vmax at var(--x) var(--y))}to{clip-path:circle(0 at var(--x) var(--y))}}
.tr[data-m=bus] .road2,.tr[data-m=bus] .trbus{display:block}
.road2{position:absolute;left:0;right:0;bottom:18%;height:64px;background:#24103a;border-block:3px solid rgba(255,255,255,.3)}
.road2::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,#fff 0 46px,transparent 46px 92px);animation:drive .45s linear infinite}
.trbus{position:absolute;left:0;bottom:calc(18% + 4px);width:clamp(260px,38vw,520px);animation:trdrive var(--tot) cubic-bezier(.4,.05,.6,.95) forwards}
.trbus svg,.trbus img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 12px rgba(0,0,0,.4))}
@keyframes trdrive{from{transform:translateX(-105%)}to{transform:translateX(100vw)}}
.tr[data-m=cortina] .pl,.tr[data-m=cortina] .pr{display:block;position:absolute;top:0;bottom:0;width:56%}
.pl{left:0;background:#c8102e;clip-path:polygon(0 0,100% 0,88% 100%,0 100%);transform:translateX(-101%)}
.pr{right:0;background:#3a1560;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%);transform:translateX(101%)}
.tr[data-m=cortina].in .pl{animation:plin var(--a) cubic-bezier(.7,0,.3,1) forwards}
.tr[data-m=cortina].in .pr{animation:prin var(--a) cubic-bezier(.7,0,.3,1) forwards}
.tr[data-m=cortina].out .pl{animation:plout var(--c) cubic-bezier(.7,0,.3,1) forwards}
.tr[data-m=cortina].out .pr{animation:prout var(--c) cubic-bezier(.7,0,.3,1) forwards}
@keyframes plin{from{transform:translateX(-101%)}to{transform:none}}
@keyframes prin{from{transform:translateX(101%)}to{transform:none}}
@keyframes plout{from{transform:none}to{transform:translateX(-101%)}}
@keyframes prout{from{transform:none}to{transform:translateX(101%)}}
.tr[data-m=ruta] .rsvg{display:block;position:absolute;inset:0;width:100%;height:100%}
.rp{fill:none;stroke:#c8102e;stroke-width:12;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--tot) linear forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.trsel{position:fixed;left:14px;bottom:14px;z-index:30;background:#fff;color:var(--ink);border-radius:99px;padding:6px 8px 6px 14px;font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(58,21,96,.25);display:flex;gap:8px;align-items:center}
.trsel select{font:inherit;border:1px solid #cdbcf2;border-radius:99px;padding:4px 8px;background:#f5eefb;color:var(--ink)}


.tree{flex:1;min-width:320px;display:flex;flex-direction:column;gap:20px;border-left:4px dotted var(--red);padding:6px 0 6px 28px}
.trow{display:flex;align-items:center}
.trow>.mem,.trow>.memlink{flex:0 0 min(340px,100%)}
.trow .wire{width:44px}
.subs{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;border-left:4px dotted var(--red);padding-left:26px}
@media (max-width:900px){.trow{flex-direction:column;align-items:flex-start;gap:12px}.trow .wire{display:none}.subs{margin-left:28px;width:calc(100% - 28px)}}
/* organigrama: cada plaza en columna, con líneas que muestran quién reporta a quién */
.stop{align-items:flex-start;gap:30px}
.people{flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;align-items:flex-start;gap:30px;margin-top:0;padding-left:55px;width:100%}
.people>*{position:relative}
.people>*,.people>.bosslink.team{width:230px;max-width:100%}
.bosslink{padding:0}
.people>*::before{content:"";position:absolute;left:-34px;top:76px;width:34px;border-top:4px dotted var(--red)}
.people>*::after{content:"";position:absolute;left:-36px;top:-30px;bottom:-30px;border-left:4px dotted var(--red)}
.people>*:last-child::after{bottom:auto;height:110px}
.route::before{left:41px;right:auto;width:calc(66.666% - 13.33px)}
@media (max-width:1100px){.route{grid-template-columns:1fr;gap:56px;padding-top:0}.route::before{display:none}.pin{margin-top:0}}

/* árbol de equipo: líneas por rama, que terminan en la última persona */
.tree{border-left:0;padding-left:30px;gap:20px}
.tree>.trow{position:relative}
.tree>.trow::before{content:"";position:absolute;left:-30px;top:50%;width:30px;border-top:4px dotted var(--red)}
.tree>.trow::after{content:"";position:absolute;left:-32px;top:-20px;bottom:-20px;border-left:4px dotted var(--red)}
.tree>.trow:first-child::after{top:50%}
.tree>.trow:last-child::after{bottom:50%}
.tree.single{padding-left:0}
.tree.single>.trow::before,.tree.single>.trow::after{display:none}
.subs{border-left:0;padding-left:30px}
.subs>*{position:relative}
.subs>*::before{content:"";position:absolute;left:-30px;top:50%;width:30px;border-top:4px dotted var(--red)}
.subs>*::after{content:"";position:absolute;left:-32px;top:-12px;bottom:-12px;border-left:4px dotted var(--red)}
.subs>*:first-child::after{top:50%}
.subs>*:last-child::after{bottom:50%}
.subs>*:only-child::after{display:none}
@media (max-width:820px){.res,.tri{grid-template-columns:1fr}.step{margin-left:calc(var(--i)*22px)}.nextlvl{margin-left:40px}.vs{grid-template-columns:1fr}.vsb{justify-self:center}.ptiles,.foda,.proj.two,.rp{grid-template-columns:1fr}.arrow2{width:4px;height:28px;margin-left:40px;background:repeating-linear-gradient(var(--red) 0 6px,transparent 6px 12px)}.rh:nth-child(2){display:none}}
@media (max-width:820px){.members{grid-template-columns:1fr;border-left:0;border-top:4px dotted var(--red);padding:24px 0 0}.wire{width:4px;height:36px;background:repeating-linear-gradient(var(--red) 0 6px,transparent 6px 12px);margin-left:60px}}
@media (max-width:820px){.caps{grid-template-columns:1fr}.tier{border-radius:28px;padding:20px}.tier .name{flex:1 0 100%}}
@media (max-width:820px){
  .bus{position:relative;right:auto;bottom:auto;width:92%;margin:36px 0 90px 4px}
  .sun{opacity:.5}
  .proj{grid-template-columns:1fr}
  .route{grid-template-columns:1fr;gap:56px;padding-top:0}
  .route::before{display:none}
  .pin{margin-top:0}
  header{flex-direction:column;align-items:flex-start;gap:6px}
  nav{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<circle cx="120" cy="136" r="24" fill="#2b2b33"/><circle cx="410" cy="136" r="24" fill="#2b2b33"/>
<circle cx="120" cy="136" r="10" fill="#b9b3c4"/><circle cx="410" cy="136" r="10" fill="#b9b3c4"/></svg>`;
const SECS={foda:'FODA',obs:'Observaciones',mapa:'Mapa estratégico',parrilla:'Parrilla de reemplazo',proyectos:'Proyectos',resultados:'Resultados psicométricos',estrategia:'Estrategia de desarrollo',cursos:'Capacitaciones',trimestres:'Desarrollo continuo'};
const PERFILES=[];
PLAZAS.forEach(pl=>pl.people.forEach(b=>[b,...(b.team||[])].forEach(p=>{ if(p.perfil){ PERFILES.push({pl,p,boss:p===b?null:b}); SUBS['p-'+p.id]='Perfil de '+p.n.split(' ')[0]; Object.keys(SECS).forEach(k=>{SUBS['p-'+p.id+'-'+k]=SECS[k];}); } })));
const findPerfil=sub=>{ for(const {pl,p,boss} of PERFILES){ if(sub==='p-'+p.id) return {pl,p,boss,sec:''}; for(const k in SECS) if(sub==='p-'+p.id+'-'+k) return {pl,p,boss,sec:k}; } return null; };
const ladder=T=>`<div class="ladder">${T.map((t,i)=>`${i?'<div class="rise" aria-hidden="true"></div>':''}<div class="tier ${t.c}">${t.to?`<button class="name" data-go="${t.to}">${t.n}<small>Ver detalle &#10095;</small></button>`:`<span class="name">${t.n}</span>`}<div class="chips">${t.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div></div>`).join('')}</div>`;
function perfilPage({pl,p,sec,boss}){
  const pf=p.perfil, me='p-'+p.id, first=p.n.split(' ')[0], bk=boss||p, flat=t=>t.flatMap(m=>[m,...(m.team?flat(m.team):[])]), P=id=>typeof id==='object'?id:(id===p.id?p:flat(p.team).find(m=>m.id===id));
  if(!sec) return `<section class="view plaza">${backBtn('equipo-'+bk.id,'Equipo de '+bk.n.split(' ')[0])}
    <div class="perfil">${card(p,'big')}<div class="pbody"><h3>Psicometría</h3><p class="psico">${pf.psico}</p>
    <div class="ptiles">${pf.tiles.map(t=>`<button class="tile ${t[2]}" data-go="${me}-${t[0]}">${t[1]}</button>`).join('')}</div>
    ${pf.extra?`<button class="go" data-go="${me}-${pf.extra[0]}">${pf.extra[1]}</button>`:''}</div></div></section>`;
  const head=(t,sub)=>`${backBtn(me,'Perfil de '+first)}<h2>${t}</h2><p class="sub">${sub||p.n+', '+p.r}</p>`;
  let b='';
  if(sec==='foda'){
    const Q=[['debilidades','Debilidades','q1','&#128078;'],['amenazas','Amenazas','q2','!'],['fortalezas','Fortalezas','q3','&#128077;'],['oportunidades','Oportunidades','q4','&#9733;']];
    b=head('<em>FODA</em>')+`<p class="hint" style="margin:0 0 6px;text-align:left">Toca cada cuadro para ver su contenido.</p><div class="foda">${Q.map(q=>{ const f=pf.foda[q[0]], items=Array.isArray(f)?f:f.items, acc=Array.isArray(f)?null:f.acciones, ul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
      const body = !items.length ? '<ul><li class="none">Aún sin contenido.</li></ul>' : acc ? `<div class="vs"><div><h4>${q[1]}</h4>${ul(items)}</div><span class="vsb" aria-hidden="true">VS</span><div><h4>Acciones</h4>${ul(acc)}</div></div>` : ul(items);
      return `<details class="fq ${q[2]}"><summary><span class="ico">${q[3]}</span>${q[1]}</summary><div class="fqb">${body}</div></details>`; }).join('')}</div>`;
  } else if(sec==='obs'){
    b=head('<em>Observaciones</em>')+`<div class="obs"><h3>Generales</h3>${pf.obs.map(o=>`<p>${o}</p>`).join('')}</div>`;
  } else if(sec==='mapa'){
    b=head('Mapa <em>estratégico</em>')+(pf.pasos?`<div class="steps">${pf.pasos.map((x,i)=>`<button class="step ${x[2]}" style="--i:${i}" data-go="${me}-${x[0]}"><span class="num">${i+1}</span>${x[1]}</button>`).join('')}<div class="nextlvl"><span aria-hidden="true">&#8635;</span>Nivel siguiente: <b>${pf.siguiente}</b></div></div>`:ladder(pf.tiers));
  } else if(sec==='parrilla'){
    b=head('Parrilla de <em>reemplazo</em>')+`<div class="rp"><div class="rh">Puesto actual</div><div></div><div class="rh">Reemplazo</div>${pf.parrilla.rows.map(r=>`${mem(P(r[0]),false)}<div class="arrow2" aria-hidden="true"></div>${mem(P(r[1]),false)}`).join('')}</div>
    <div class="facts">${[...(pf.parrilla.fecha?[['Última actualización',pf.parrilla.fecha]]:[]),...(pf.parrilla.extra||[])].map(f=>`<div><b>${f[0]}</b>${f[1]}</div>`).join('')}</div>
    <a class="go" href="${pf.parrilla.doc}" target="_blank" rel="noopener">Abrir el formato completo</a>`;
  } else if(sec==='resultados'){
    const cs=pf.comp, t0=cs.reduce((a,c)=>a+c[2],0), t1=cs.reduce((a,c)=>a+c[3],0);
    b=head('Competencias en examen <em>psicométrico</em>')+`<div class="res"><div class="tblwrap"><table class="tbl"><thead><tr><th>#</th><th>Competencias</th><th>Clasificación</th><th>Dominio</th><th>Resultado</th></tr></thead><tbody>${cs.map((c,i)=>`<tr><td>${i+1}</td><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td class="${c[3]>c[2]?'up':c[3]<c[2]?'down':''}">${c[3]}</td></tr>`).join('')}</tbody><tfoot><tr><td></td><td colspan="2">Resultados</td><td>${t0}</td><td>${t1}</td></tr></tfoot></table></div>
    <div class="chart" role="img" aria-label="Gráfica de dominio contra resultado por competencia"><div class="plot">${cs.map(c=>`<div class="grp"><div class="pair"><div class="bar d" style="height:${c[2]/4*100}%"></div><div class="bar r" style="height:${c[3]/4*100}%"></div></div><label>${c[0]}</label></div>`).join('')}</div><div class="legend"><i class="d"></i>Dominio<i class="r"></i>Resultado</div></div></div>`;
  } else if(sec==='estrategia'){
    const e=pf.estrategia;
    b=head('Estrategia de <em>desarrollo</em>')+`<div class="tblwrap"><table class="tbl est"><thead><tr><th>Práctica</th><th>Acción</th><th>Entregables</th><th>Fecha compromiso</th></tr></thead><tbody>${e.filas.map(f=>`<tr><th scope="row">${f[0]}</th><td>${f[1]||'&mdash;'}</td><td>${f[2]||'&mdash;'}</td><td>${f[3]||'&mdash;'}</td></tr>`).join('')}<tr><th scope="row">Programa</th><td><b>${[].concat(e.programa.nombre).join('</b><br><b>')}</b></td><td>${e.programa.cursos.join('<br>')}</td><td>${e.programa.periodo}</td></tr></tbody></table></div>`;
  } else if(sec==='cursos'){
    b=head('Cursos realizados <em>1er semestre 2026</em>')+`<div class="caps">${pf.cursos.map(c=>`<article class="cap"><h3>${c.t}</h3>${c.sub?`<p><b>${c.sub}</b></p>`:''}<ul class="clist">${c.items.map(x=>`<li>${x}</li>`).join('')}</ul></article>`).join('')}</div>`;
  } else if(sec==='trimestres'){
    b=head('Desarrollo <em>continuo</em>','Seguimiento de resultados a través del EDI trimestral')+`<div class="tri">${pf.trimestres.map(t=>`<button class="trib" data-img="${t[1]}" data-name="${t[0]}"><div class="shot">${t[0]}<img src="${t[1]}" alt="${t[0]}" onerror="this.remove()"></div><span>${t[0]}: ampliar &#10095;</span></button>`).join('')}</div>`;
  } else {
    const cp=PROY.find(x=>x.n===pl.n);
    b=head('Iniciativas <em>regionales</em>',pl.n)+`<div class="proj two"><div class="col"><h3 style="background:#cdbcf2">Proyectos</h3>${cp.items.map(i=>`<button class="item" data-proj="${i[1]}" data-name="${i[0]}"><b>${i[0]}</b><small>Ver carátula &#10095;</small></button>`).join('')}</div>
    <div class="col"><h3 style="background:#cdbcf2">Réplicas</h3>${pf.replicas.map(r=>`<div class="item"><b>${r[0]}</b><small>${r[1]}</small></div>`).join('')}</div></div>`;
  }
  return `<section class="view plaza">${b}</section>`;
}

function render(){
  const k = location.hash.replace('#/','') || 'inicio';
  const sub = SUBS[k] ? k : null;
  const eq = sub && sub.startsWith('equipo-') ? PLAZAS.find(pl=>pl.people.some(p=>'equipo-'+p.id===sub)) : null;
  const pf = sub ? findPerfil(sub) : null;
  const key = eq ? eq.k : pf ? pf.pl.k : sub ? 'gerencia' : (VIEWS.find(v=>v.k===k)||VIEWS[0]).k;
  nav.querySelectorAll('button').forEach(b=>{ b.dataset.k===key ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'); });
  const page = sub || key;
  let h='';
  if(page==='inicio'){
    h=`<section class="view cover"><h1>Desarrollo de colaboradores <span>y parrilla de reemplazo 2026</span></h1>
    <p>Conoce al equipo de la Gerencia Administrativa Divisional Sureste, plaza por plaza.</p>
    <button class="go" data-go="organigrama">Comenzar el recorrido <span aria-hidden="true">&#10095;</span></button>
    <div class="sun" aria-hidden="true"></div>
    <div class="bus" aria-hidden="true">${BUS_SVG}</div>
    <div class="road" aria-hidden="true"></div></section>`;
  } else if(page==='organigrama'){
    h=`<section class="view"><div class="top"><button class="bosslink" data-go="gerencia" aria-label="Ver la gerencia divisional">${card(GERENTE,'boss')}</button><div class="stem"></div></div>
    <div class="route">${PLAZAS.map(p=>`<div class="stop">
      <button class="pin" data-go="${p.k}" aria-label="Ver equipo de ${p.n}">${p.n}</button>
      <div class="people">${p.people.map(x=>pc(x)).join('')}</div></div>`).join('')}</div>
    <p class="hint">Toca una plaza para ver su equipo, o al gerente para ver su mapa, parrilla y proyectos.</p></section>`;
  } else if(page==='gerencia'){
    h=`<section class="view">${backBtn('organigrama','Organigrama')}
    <div class="hub">${card(GERENTE,'boss')}<div class="tiles">
      <button class="tile t1" data-go="mapa">Mapa estratégico</button>
      <button class="tile t2" data-go="parrilla">Parrilla de reemplazo<small>Sucesión y plan de desarrollo</small></button>
      <button class="tile t3" data-go="proyectos">Proyectos regionales<small>8 proyectos en 3 plazas</small></button></div></div></section>`;
  } else if(pf){
    h=perfilPage(pf);
  } else if(eq){
    const boss = eq.people.find(p=>'equipo-'+p.id===sub);
    h=`<section class="view plaza">${backBtn(eq.k,eq.n)}<h2>Equipo de <em>${boss.n.split(' ')[0]}</em></h2>
    <p class="sub">${boss.r}, ${eq.n}. ${cnt(boss.team)} colaboradores a su cargo.</p>
    <div class="branch">${boss.perfil?`<button class="bosslink team" data-go="p-${boss.id}" aria-label="Ver el perfil de ${boss.n}">${card(boss,'big')}<span class="badge">Ver perfil &#10095;</span></button>`:card(boss,'big')}<div class="wire" aria-hidden="true"></div>
    ${boss.team.some(m=>m.team)?`<div class="tree${boss.team.length===1?' single':''}">${boss.team.map(m=>`<div class="trow">${mem(m)}${m.team?`<div class="wire" aria-hidden="true"></div><div class="subs">${m.team.map(x=>mem(x)).join('')}</div>`:''}</div>`).join('')}</div>`:`<div class="members">${boss.team.map(m=>mem(m)).join('')}</div>`}</div></section>`;
  } else if(page==='mapa'){
    h=`<section class="view plaza">${backBtn('gerencia','Gerencia')}<h2>Mapa <em>estratégico</em></h2>
    <p class="sub">Se construye de abajo hacia arriba. Toca cada nivel para ver el detalle.</p>
    ${ladder(TIERS)}</section>`;
  } else if(page==='desempeno'){
    h=`<section class="view plaza">${backBtn('mapa','Mapa estratégico')}<h2>Evaluación de <em>desempeño</em></h2>
    <p class="sub">1er semestre 2026</p>
    <div class="doc">${shot('img/evaluacion-desempeno.png','Evaluación de desempeño')}
    <a class="go" href="docs/evaluacion-desempeno.pdf" target="_blank" rel="noopener">Abrir la evaluación completa</a></div></section>`;
  } else if(page==='integracion'){
    h=`<section class="view plaza">${backBtn('mapa','Mapa estratégico')}<h2>Mejora de <em>habilidades</em></h2>
    <div class="split">${shot('img/integracion.jpg','Integración')}
    <div class="txt"><h3 style="font-family:var(--display);color:var(--ink);font-size:clamp(24px,3.4vw,38px);margin-bottom:16px">Integración</h3>
    Actividades de integración para reforzar el trabajo en equipo e integración a equipos de trabajo dinámicos.</div></div></section>`;
  } else if(page==='capacitaciones'){
    const C=[['LinkedIn Learning','Tronco común, 1 semana','linkedin'],['Cursos ERP financiero','Fundamentos comunes JDE','erp'],['Office 365','Certificado DCIT','office365']];
    h=`<section class="view plaza">${backBtn('mapa','Mapa estratégico')}<h2>Capacitaciones <em>2026</em></h2>
    <div class="caps">${C.map(c=>`<article class="cap">${shot('img/'+c[2]+'.jpg',c[0])}<h3>${c[0]}</h3><p>${c[1]}</p></article>`).join('')}</div></section>`;
  } else if(page==='parrilla'){
    h=`<section class="view plaza">${backBtn('gerencia','Gerencia')}<h2>Parrilla de <em>reemplazo</em></h2>
    <p class="sub">Quién asume la gerencia divisional si llega a ser necesario.</p>
    <div class="succ"><div><span class="tag">Puesto actual</span>${card(GERENTE,'big')}</div><div class="arrow"></div>
    <div><span class="tag">Reemplazo</span>${card(SUCESOR,'big')}</div></div>
    <div class="facts"><div><b>Plan de desarrollo</b>Anexo 1</div><div><b>Última actualización</b>01-06-2026</div></div>
    <a class="go" href="docs/parrilla-reemplazo.pdf" target="_blank" rel="noopener">Abrir el formato completo</a></section>`;
  } else if(page==='proyectos'){
    h=`<section class="view plaza">${backBtn('gerencia','Gerencia')}<h2>Proyectos <em>regionales</em></h2>
    <p class="sub">Toca un proyecto para ver su carátula.</p>
    <div class="proj">${PROY.map(p=>`<div class="col"><h3 style="background:${p.c}">${p.n}</h3>
    ${p.items.map(i=>`<button class="item" data-proj="${i[1]}" data-name="${i[0]}"><b>${i[0]}</b><small>Ver carátula &#10095;</small></button>`).join('')}</div>`).join('')}</div></section>`;
  } else {
    const p = PLAZAS.find(x=>x.k===page), i = PLAZAS.indexOf(p);
    const nx = PLAZAS[(i+1)%PLAZAS.length];
    h=`<section class="view plaza">${backBtn('organigrama','Organigrama')}
    <h2>${p.n}</h2><p class="sub">${p.people.length} jefaturas reportan a la gerencia divisional.</p>
    <div class="lead">${card(GERENTE,'boss')}<div class="line"></div><small>Reportan a ${GERENTE.n.split(' ')[0]}</small></div>
    <div class="team">${p.people.map(x=>pc(x,'big')).join('')}</div>
    <p class="hint"><button class="back" data-go="${nx.k}">Siguiente parada: ${nx.n} &#10095;</button></p></section>`;
  }
  app.innerHTML=h; scrollTo(0,0);
  const mark = SUBS[page] || (PLAZAS.find(p=>p.k===page)||VIEWS.find(x=>x.k===page)||{}).n;
  const vw = app.querySelector('.view'); if(vw && page!=='inicio' && mark) vw.dataset.mark = mark;
}
app.onclick = e => {
  const im=e.target.closest('[data-img]'); if(im) return openProj(null,im.dataset.name,im.dataset.img);
  const p=e.target.closest('[data-proj]'); if(p) return openProj(p.dataset.proj,p.dataset.name);
  const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go);
};
const modal=document.getElementById('modal'); let lastBtn=null;
function openProj(slug,name,src){
  lastBtn=document.activeElement; const f=src||`img/proyectos/${slug}.png`;
  modal.querySelector('.sheet').innerHTML=`<img src="${f}" alt="${name}" onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'miss',textContent:'Falta la imagen de ${name}. Guárdala como ${f}'}))">`;
  modal.hidden=false; modal.querySelector('.x').focus();
}
function closeProj(){ modal.hidden=true; if(lastBtn) lastBtn.focus(); }
modal.onclick = e => { if(e.target===modal || e.target.closest('.x')) closeProj(); };
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!modal.hidden) closeProj(); });

/* ===== TRANSICIONES entre apartados (elige una con el selector de la esquina) ===== */
const TR_OPTS={bus:'Autobús',cortina:'Cortina',circulo:'Círculo',ruta:'Ruta',ninguna:'Sin transición'};
const TR_T={bus:{a:260,b:380,c:360},cortina:{a:420,b:80,c:420},circulo:{a:480,b:60,c:480},ruta:{a:300,b:500,c:300}};
let trMode='bus'; try{ trMode=localStorage.getItem('tr')||'bus'; }catch(e){}
if(!TR_OPTS[trMode]) trMode='bus';
let trBusy=false, lastXY=[innerWidth/2,innerHeight/2];
const trEl=document.getElementById('tr'), trSel=document.getElementById('trsel');
trEl.innerHTML=`<div class="road2"></div><div class="trbus">${BUS_SVG}<img src="img/camion-ado.png" alt="" onload="this.previousElementSibling.remove()" onerror="this.remove()"></div>
<div class="pl"></div><div class="pr"></div>
<svg class="rsvg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path class="rp" pathLength="1" d="M-100 420C200 100 450 700 700 330S1000 250 1150 300"/><circle r="18" fill="#c8102e" stroke="#fff" stroke-width="5"><animateMotion id="rpin" begin="indefinite" fill="freeze" dur="1s" path="M-100 420C200 100 450 700 700 330S1000 250 1150 300"/></circle></svg>`;
trSel.innerHTML=Object.keys(TR_OPTS).map(k=>`<option value="${k}"${k===trMode?' selected':''}>${TR_OPTS[k]}</option>`).join('');
addEventListener('pointerdown',e=>{ lastXY=[e.clientX,e.clientY]; });
function runTransition(swap){
  if(trMode==='ninguna'||trBusy||matchMedia('(prefers-reduced-motion:reduce)').matches){ swap(); return; }
  const t=TR_T[trMode]; trBusy=true;
  trEl.hidden=false; trEl.dataset.m=trMode;
  trEl.style.cssText=`--a:${t.a}ms;--c:${t.c}ms;--tot:${t.a+t.b+t.c}ms;--x:${lastXY[0]}px;--y:${lastXY[1]}px`;
  const pin=document.getElementById('rpin'); if(trMode==='ruta'&&pin&&pin.beginElement){ pin.setAttribute('dur',(t.a+t.b+t.c)+'ms'); pin.beginElement(); }
  trEl.className='tr in';
  setTimeout(()=>{ swap(); setTimeout(()=>{ trEl.className='tr out'; setTimeout(()=>{ trEl.hidden=true; trEl.className='tr'; trBusy=false; },t.c); },t.b); },t.a);
}
trSel.onchange=()=>{ trMode=trSel.value; try{localStorage.setItem('tr',trMode);}catch(e){} runTransition(()=>{}); };
addEventListener('hashchange',()=>runTransition(render));
addEventListener('keydown',e=>{
  if(!modal.hidden) return;
  const k=location.hash.replace('#/','')||'inicio', i=VIEWS.findIndex(v=>v.k===k); if(i<0) return;
  if(e.key==='ArrowRight'&&i<VIEWS.length-1) go(VIEWS[i+1].k);
  if(e.key==='ArrowLeft'&&i>0) go(VIEWS[i-1].k);
});
render();
</script>
</body>
</html>
